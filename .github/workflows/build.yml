name: Loseless Polyglot CI & Native Matrix Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-node:
    name: Node Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm ci || npm install
      - name: Run Test Suite
        run: npm test

  test-python:
    name: Python Evaluation Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Empirical Benchmarks
        run: python benchmarks/eval_runner.py

  build-go:
    name: Go Native Core Build Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Compile Native Binary
        run: |
          mkdir -p bin/release
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w" -o bin/release/loseless-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/loseless
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loseless-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/release/loseless-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
