<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Signal Fidelity Waves (Lossless Waveform) -->
  <path d="M 96 256 H 176 L 216 160 L 256 352 L 296 208 L 336 256 H 416" 
        fill="none" 
        stroke="#065f46" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.6" />
        
  <!-- Glowing Precision Diamond Core -->
  <g filter="url(#glow)">
    <polygon points="256,96 368,256 256,416 144,256" 
             fill="none" 
             stroke="url(#gemGrad)" 
             stroke-width="16" 
             stroke-linejoin="round" />
    <circle cx="256" cy="256" r="32" fill="url(#gemGrad)" />
  </g>
  
  <!-- Gatekeeper Crosshairs -->
  <line x1="256" y1="64" x2="256" y2="128" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="384" x2="256" y2="448" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <line x1="112" y1="256" x2="176" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <line x1="336" y1="256" x2="400" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
</svg>
