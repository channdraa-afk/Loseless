description = "Trace the true root cause of a bug, vulnerability, or raw Burp Suite/API request"
prompt = "Investigate the root cause of the reported bug, vulnerability, or raw HTTP request: {{args}}. Do NOT assume the user's initial guess is correct. Step 1: Decouple the observed symptom from the cause. Step 2: Trace the Trust Boundary (Client is untrusted; verify Server/DB invariant). Step 3: Map wire endpoint to codebase. Step 4: Formulate Hypothesis Reality Check (correct any client-side fallacy). Step 5: Specify the single surgical fix at the convergence root with a zero-framework runnable proof-of-fix assertion."
