description = "Audit the codebase for over-engineering, dead code, and removable bloat"
prompt = "Audit the entire repository for over-engineering, dead code, and unnecessary complexity. One line per finding, ranked biggest cut first: <tag> <what to cut>. <replacement>. [path]. Tags: delete (dead code/speculative feature), stdlib (reinvented standard library), native (dependency doing what the platform does), yagni (abstraction with one implementation), shrink (same logic, fewer lines). End with the net lines and dependencies removable. If nothing to cut: 'Lean already. Ship.'"
